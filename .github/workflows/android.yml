name: Build RealWorld V5 Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false

      - name: Import project
        run: godot --headless --editor --quit

      - name: Build Android
        run: |
          mkdir -p build
          godot --headless --path . --export-release "Android" build/RealWorld-V5.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: real-world-v5-apk
          path: build/RealWorld-V5.apk
