name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"
          sdkmanager "cmdline-tools;latest"
          sdkmanager "ndk;26.3.11579264"
          sdkmanager "cmake;3.22.1"

      - name: Configure Android environment
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "PATH=$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH" >> "$GITHUB_ENV"

      - name: Download Godot
        run: |
          mkdir -p "$HOME/godot"
          wget -q \
            https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip \
            -O "$HOME/godot/godot.zip"
          unzip -q "$HOME/godot/godot.zip" -d "$HOME/godot"
          chmod +x "$HOME/godot/Godot_v4.4.1-stable_linux.x86_64"

      - name: Install Godot export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          wget -q \
            https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz \
            -O "$HOME/godot/templates.tpz"
          unzip -q "$HOME/godot/templates.tpz" -d "$HOME/godot/templates"
          cp -r "$HOME/godot/templates/templates/"* \
            "$HOME/.local/share/godot/export_templates/4.4.1.stable/" || true

      - name: Configure Godot Android paths
        run: |
          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME_17_X64"
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          EOF

          echo "Java SDK: $JAVA_HOME_17_X64"
          echo "Android SDK: $ANDROID_SDK_ROOT"
          test -x "$ANDROID_SDK_ROOT/platform-tools/adb"
          test -x "$JAVA_HOME_17_X64/bin/java"

      - name: Verify Android tools
        run: |
          java -version
          adb version
          echo "=== JAVA ==="
          java -version

          echo "=== ANDROID SDK ==="
          echo "$ANDROID_SDK_ROOT"
          test -d "$ANDROID_SDK_ROOT/platform-tools"
          test -d "$ANDROID_SDK_ROOT/build-tools/35.0.0"
          test -d "$ANDROID_SDK_ROOT/platforms/android-35"
          test -d "$ANDROID_SDK_ROOT/ndk/26.3.11579264"
          test -d "$ANDROID_SDK_ROOT/cmake/3.22.1"

          echo "=== GODOT ==="
          "$HOME/godot/Godot_v4.4.1-stable_linux.x86_64" --version

      - name: Export APK
        run: |
          mkdir -p build
          "$HOME/godot/Godot_v4.4.1-stable_linux.x86_64" \
            --headless \
            --verbose \
            --path "$GITHUB_WORKSPACE" \
            --export-release "Android" \
            "$GITHUB_WORKSPACE/build/real_world_open_world.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: real-world-open-world-apk
          path: build/real_world_open_world.apk
