name: Build RealWorld V5 Android

on:
  push:
    branches: [v5]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Godot export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          wget -q \
            "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz" \
            -O /tmp/templates.tpz
          rm -rf /tmp/godot-templates
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          find /tmp/godot-templates -type f -maxdepth 3
          cp -f /tmp/godot-templates/templates/* \
            "$HOME/.local/share/godot/export_templates/4.4.1.stable/"

      - name: Verify Android environment
        run: |
          echo "===== JAVA ====="
          java -version

          echo "===== ANDROID SDK ====="
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo "===== ADB ====="
          adb version

          echo "===== APKSIGNER ====="
          which apksigner || true
          apksigner version || true

          echo "===== GODOT TEMPLATES ====="
          ls -lh "$HOME/.local/share/godot/export_templates/4.4.1.stable/"

          test -f "$HOME/.local/share/godot/export_templates/4.4.1.stable/android_debug.apk"
          test -f "$HOME/.local/share/godot/export_templates/4.4.1.stable/android_release.apk"

      - name: Import project
        run: |
          godot --headless --path . --editor --quit

      - name: Build Android APK
        run: |
          mkdir -p build
          godot --headless --path . \
            --export-release "Android" \
            build/RealWorld-V5.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: real-world-v5-apk
          path: build/RealWorld-V5.apk
