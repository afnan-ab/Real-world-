name: Build RealWorld V5 Android

on:
  push:
    branches: [v5]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false

      - name: Install Godot Android export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          wget -q \
            https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz \
            -O /tmp/templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp -f /tmp/godot-templates/templates/* \
            "$HOME/.local/share/godot/export_templates/4.4.1.stable/"

      - name: Verify templates
        run: |
          ls -lh "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
          test -f "$HOME/.local/share/godot/export_templates/4.4.1.stable/android_debug.apk"
          test -f "$HOME/.local/share/godot/export_templates/4.4.1.stable/android_release.apk"

      - name: Diagnose Android environment
        run: |
          set +e

          echo "===== GODOT ====="
          godot --version

          echo "===== JAVA ====="
          java -version

          echo "===== ANDROID VARIABLES ====="
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo "===== GODOT TEMPLATES ====="
          find "$HOME/.local/share/godot/export_templates" -maxdepth 3 -type f -print 2>/dev/null

          echo "===== SDK SEARCH ====="
          find "$ANDROID_HOME" -maxdepth 3 -type f \( -name adb -o -name apksigner \) -print 2>/dev/null

          echo "===== GODOT IMPORT ====="
          godot --headless --path . --editor --quit

          echo "===== ANDROID EXPORT CHECK ====="
          godot --headless --path . --export-release "Android" /tmp/RealWorld-V5-test.apk

          echo "===== END DIAGNOSTIC ====="

      - name: Build Android APK
        run: |
          mkdir -p build
          godot --headless --path . \
            --export-release "Android" \
            build/RealWorld-V5.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: real-world-v5-apk
          path: build/RealWorld-V5.apk
