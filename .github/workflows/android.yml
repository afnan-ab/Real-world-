name: Build Android APK
# Debug APK verification uses ZIP integrity; no release signature is required.

on:
  workflow_dispatch:
  push:
    branches: [main, 'phase-*']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"
          sdkmanager "cmdline-tools;latest"
          sdkmanager "ndk;26.3.11579264"
          sdkmanager "cmake;3.22.1"

      - name: Configure Android environment
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Restore signing keystore
        if: env.KEYSTORE_B64 != ''
        run: |
          mkdir -p .github/keystore
          printf '%s' "$KEYSTORE_B64" | base64 --decode > .github/keystore/realworld.keystore
          chmod 600 .github/keystore/realworld.keystore
          test -s .github/keystore/realworld.keystore

      - name: Create Android debug keystore
        run: |
          mkdir -p .github/keystore
          keytool -genkeypair -v \
            -keystore .github/keystore/debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Verify signing keystore
        if: env.KEYSTORE_B64 != ''
        run: |
          keytool -list \
            -keystore .github/keystore/realworld.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS"

      - name: Install Godot
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          unzip -q Godot_v4.4.1-stable_linux.x86_64.zip
          chmod +x Godot_v4.4.1-stable_linux.x86_64
          mkdir -p /tmp/godot_templates
          unzip -q Godot_v4.4.1-stable_export_templates.tpz -d /tmp/godot_templates
          unzip -q /tmp/godot_templates/templates/android_source.zip -d "$HOME/.local/share/godot/export_templates/4.4.1.stable" || true
          cp /tmp/godot_templates/templates/android_debug.apk "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
          cp /tmp/godot_templates/templates/android_release.apk "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
          cp /tmp/godot_templates/templates/version.txt "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
          ls -lah "$HOME/.local/share/godot/export_templates/4.4.1.stable"

      - name: Validate Godot project
        run: |
          ./Godot_v4.4.1-stable_linux.x86_64 \
            --headless \
            --editor \
            --path . \
            --quit \
            --verbose 2>&1 | tee /tmp/validate.log || true

      - name: Fetch free CC0 car models (Kenney Car Kit)
        # Optional: if the download or the file names differ, the build goes on
        # with the built-in simple cars. The log lists every .glb that was found.
        continue-on-error: true
        run: |
          mkdir -p assets/models /tmp/kenney
          wget -q -U "Mozilla/5.0" -O /tmp/kenney.zip https://opengameart.org/sites/default/files/kenney_car-kit_3.1.zip
          unzip -q /tmp/kenney.zip -d /tmp/kenney
          echo "--- folders in the pack ---"
          find /tmp/kenney -type d | sort
          echo "--- .png files in the pack ---"
          find /tmp/kenney -type f -iname "*.png" | sort | head -60
          echo "--- .glb files found in the pack ---"
          find /tmp/kenney -type f -iname "*.glb" | sort
          for name in sedan hatchback-sports suv taxi van sedan-sports police ambulance firetruck; do
            src=$(find /tmp/kenney -type f -iname "$name.glb" | head -1)
            if [ -n "$src" ] && [ ! -e "assets/models/$name.glb" ]; then
              cp "$src" "assets/models/$name.glb"
              echo "copied $name.glb"
            else
              echo "not copied: $name.glb"
            fi
          done
          # The cars take their colours from colormap.png. Keep it next to the
          # models, in a Textures/ folder, where the .glb files look for it.
          tex=$(find /tmp/kenney -type f -ipath "*GLB*" -iname "colormap.png" | head -1)
          if [ -z "$tex" ]; then
            tex=$(find /tmp/kenney -type f -iname "colormap.png" | head -1)
          fi
          if [ -n "$tex" ]; then
            mkdir -p assets/models/Textures
            cp "$tex" assets/models/Textures/colormap.png
            echo "copied colormap.png from $tex"
          else
            echo "no colormap.png found"
          fi
          ls -laR assets/models

      - name: Fetch free CC0 textures (ambientCG)
        # Optional: Grass001 -> ground, Concrete034 -> city. If a download fails
        # the game keeps its built-in colours. The log lists what was found.
        continue-on-error: true
        run: |
          mkdir -p assets/textures /tmp/tex
          fetch_tex() {
            id="$1"
            target="$2"
            wget -q -U "Mozilla/5.0" -O "/tmp/tex/$id.zip" "https://ambientcg.com/get?file=${id}_1K-JPG.zip" || { echo "download failed: $id"; return 0; }
            mkdir -p "/tmp/tex/$id"
            unzip -q -o "/tmp/tex/$id.zip" -d "/tmp/tex/$id" || { echo "unzip failed: $id"; return 0; }
            echo "--- files in $id ---"
            find "/tmp/tex/$id" -type f | sort
            color=$(find "/tmp/tex/$id" -type f -iname "*_Color.jpg" | head -1)
            normal=$(find "/tmp/tex/$id" -type f -iname "*_NormalGL.jpg" | head -1)
            if [ -n "$color" ]; then
              cp "$color" "assets/textures/${target}_albedo.jpg"
              echo "copied ${target}_albedo.jpg"
            fi
            if [ -n "$normal" ]; then
              cp "$normal" "assets/textures/${target}_normal.jpg"
              echo "copied ${target}_normal.jpg"
            fi
          }
          fetch_tex Grass001 ground || true
          fetch_tex Concrete034 city || true
          ls -la assets/textures

      - name: Import assets (models and textures from assets/)
        run: |
          ./Godot_v4.4.1-stable_linux.x86_64 \
            --headless \
            --path . \
            --import

      - name: Smoke test (play the game headless with a script)
        # Runs the real main scene without a screen and lets smoke_scenario.gd
        # press the buttons (mission, car, shooting, cops, home, jail, helicopter,
        # fixer, kiosk), so script errors end up in the log. Never fails the build.
        continue-on-error: true
        env:
          MC_SMOKE: "1"
        run: |
          timeout 240 ./Godot_v4.4.1-stable_linux.x86_64 \
            --headless \
            --path . \
            --quit-after 1500 2>&1 | tee /tmp/smoke.log || true

      - name: Export Android APK
        run: |
          mkdir -p build
          ./Godot_v4.4.1-stable_linux.x86_64 \
            --headless \
            --path . \
            --export-debug Android \
            build/real_world_open_world.apk \
            --verbose

      - name: Verify APK
        run: |
          ls -lh build/real_world_open_world.apk
          test -s build/real_world_open_world.apk
          unzip -t build/real_world_open_world.apk >/dev/null
          echo "APK ZIP integrity: OK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: real-world-open-world-apk
          path: build/real_world_open_world.apk
          if-no-files-found: error

      - name: Publish diagnostics to the ci-logs branch
        # Writes the script errors from the validate and smoke steps to
        # logs/<branch>.txt on the ci-logs branch so they can be read without
        # opening the Actions logs. Never fails the build.
        if: always()
        continue-on-error: true
        run: |
          {
            echo "branch: $GITHUB_REF_NAME"
            echo "commit: $GITHUB_SHA"
            echo
            echo "=== boot layer lines ==="
            grep -hE "MC boot" /tmp/smoke.log || echo "(none)"
            echo
            echo "=== smoke scenario progress ==="
            grep -hE "^SMOKE" /tmp/smoke.log || echo "(none)"
            echo
            echo "=== errors from the validate step (old unused scripts are expected here) ==="
            grep -nE "SCRIPT ERROR|Parse Error|ERROR:|Failed to load script|Compile Error" /tmp/validate.log | head -80 || echo "(none)"
            echo
            echo "=== errors from the smoke test ==="
            grep -nE "SCRIPT ERROR|Parse Error|ERROR:|Failed to load script|Compile Error|Invalid |WARNING:" /tmp/smoke.log | head -200 || echo "(none)"
            echo
            echo "=== last 40 lines of the smoke test ==="
            tail -40 /tmp/smoke.log || true
          } > /tmp/diag.txt 2>&1 || true
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          SAFE_NAME="${GITHUB_REF_NAME//\//_}"
          cp /tmp/diag.txt "/tmp/$SAFE_NAME.txt"
          if git ls-remote --exit-code --heads origin ci-logs >/dev/null 2>&1; then
            git fetch origin ci-logs
            git checkout -f -B ci-logs FETCH_HEAD
          else
            git checkout --orphan ci-logs
            git rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p logs
          cp "/tmp/$SAFE_NAME.txt" "logs/$SAFE_NAME.txt"
          git add logs
          git commit -m "ci logs for $GITHUB_REF_NAME" || true
          git push origin ci-logs
