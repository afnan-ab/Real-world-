name: Build RealWorld V5 Android

on:
  push:
    branches: [v5]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false

      - name: Install Android export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          wget -q --show-progress \
            https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz \
            -O /tmp/godot_templates.tpz
          unzip -q -o /tmp/godot_templates.tpz -d /tmp/godot_templates
          cp -a /tmp/godot_templates/templates/. \
            "$HOME/.local/share/godot/export_templates/4.4.1.stable/"

      - name: Check project
        run: |
          godot --headless --path . --editor --quit

      - name: Build Android APK
        run: |
          mkdir -p build
          godot --headless --path . \
            --export-release "Android" \
            build/RealWorld-V5.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: real-world-v5-apk
          path: build/RealWorld-V5.apk
